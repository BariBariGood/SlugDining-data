name: occupancy-snapshot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: |
          [ "$(TZ=America/Los_Angeles date +%H)" -ge 6 ] || { echo "facilities closed (midnight-6am PT) — skipping"; exit 0; }
          dart run tool/occupancy.dart
      - name: Commit snapshot
        run: |
          git config user.name "slugdining-data-bot"
          git config user.email "slugdining-data-bot@users.noreply.github.com"
          git add data/gym_occupancy_history.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Record gym occupancy snapshot"
            git push
          fi
